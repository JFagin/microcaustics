name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check Python 3.10-compatible source and tests
        run: python -m pytest -q --cov=microcaustics --cov-report=term

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,docs,test]"
      - name: Static analysis
        run: ruff check src tests examples
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: Build distributions
        run: python -m build

  lenstronomy-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install independent validation dependencies
        run: python -m pip install -e ".[test,validation]"
      - name: Compare against lenstronomy
        run: python -m pytest -q tests/test_external_oracles.py
        env:
          MICROCAUSTICS_RUN_LENSTRONOMY: "1"
