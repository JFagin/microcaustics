name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run package tests
        run: python -m pytest -q --cov=microcaustics --cov-report=term

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,docs,test]"
      - name: Static analysis
        run: ruff check src tests examples
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: Build distributions
        run: python -m build

  optional-integrations:
    name: Optional integrations / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      MICROCAUSTICS_RUN_LENSTRONOMY: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install independent validation dependencies
        run: python -m pip install -e ".[test,validation,macro]"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Require optional integrations for this job
        run: >-
          python -c "import caustics, scipy, astropy; from lenstronomy.LensModel.lens_model import LensModel; from speclite.filters import load_filters; from importlib.metadata import version; print({name: version(name) for name in ('torch', 'caustics', 'lenstronomy', 'scipy', 'astropy', 'speclite')})"
      - name: Test optional integrations and independent comparisons
        run: >-
          python -m pytest -q
          tests/test_external_oracles.py
          tests/test_native_macroimages.py
          tests/test_legacy_macro_solver.py
          tests/test_caustics_adapter.py
          tests/test_rendering.py
          tests/test_high_precision_device.py
          tests/test_lamppost_numerics.py
          tests/test_response_rebin.py
          tests/test_lens_populations.py
          tests/test_spectra.py
